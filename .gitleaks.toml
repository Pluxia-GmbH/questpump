# The Firebase client config files (2026-10-09: 1 gcp-api-key hit in google-services.json, and the generic key rule's
# on the same value once that one is quiet): their API keys identify the questpump project and ship in every app,
# public by design (AGENTS.md, "Commits"; App Check guards the calls). Only a Google API key there is quiet; a service
# account's key or any other value in them still fails.
[[allowlists]]
description = "Firebase client config: public API keys by design"
targetRules = ["gcp-api-key", "generic-api-key"]
condition = "AND"
paths = [
  '''^android/phone/google-services\.json$''',
  '''^apple/iOS/GoogleService-Info\.plist$''',
]
regexTarget = "secret"
regexes = ['''^AIza[0-9A-Za-z_-]{35}$''']

# The Play licensing key (2026-10-09: 1 generic-api-key hit in contract/store.json, from 6c1b7524 on main, read once
# Secret Scan diffs a merge of main): play.license_key is the base64 DER of an RSA-2048 public key
# (SubjectPublicKeyInfo, exponent 65537), the public half of the key Play signs purchases with, which apps carry:
# public by design (tools/store/store.py checks its shape, questpump-core's pro.rs verifies Play proofs with it). Only
# a 2048-bit RSA public key of that shape in that file is quiet; any other value there, or the key elsewhere, fails.
[[allowlists]]
description = "The Play licensing key: an RSA public key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^contract/store\.json$''']
regexTarget = "secret"
regexes = ['''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA[A-Za-z0-9+/]{342}IDAQAB$''']

# "login" in prose (2026-10-09: 5 generic-password hits in the rust-helper skill's macos-capture-and-tcc.md and 2 in
# helper/src-tauri/src/autostart.rs, all "login (<words>, `<code>`)"): the rule reads a parenthesis after "login" with
# a comma and a quoted or backticked part as login(user, "password"). Only a match that starts "login (" with its
# space, in those two files, is quiet; the same prose elsewhere fails until its file joins the list here.
[[allowlists]]
description = "Start-at-login prose read as a login call"
targetRules = ["generic-password"]
condition = "AND"
paths = [
  '''^\.claude/skills/rust-helper/references/macos-capture-and-tcc\.md$''',
  '''^helper/src-tauri/src/autostart\.rs$''',
]
regexTarget = "match"
regexes = ['''^login \(''']
