openapi: 3.1.1
info:
  title: QuestPump companion link
  version: "1"
  license:
    name: MIT
    identifier: MIT
  description: |
    The link between the QuestPump helper on the player's computer and the phone or watch app (docs/companion.md,
    "The protocol" and "Countdown sync"; docs/plan.md slice 7). The helper serves it; the apps call it. Every
    implementation replays `contract/fixtures/seal.json` (the keys and the seal) and `contract/fixtures/wire.json`
    (every body below as the plaintext JSON), and since slice 43 the helper and both phone cores
    `contract/fixtures/ble.json` (the Bluetooth link below), so the Rust helper, the Swift apps and the Kotlin apps read
    one another.

    Plain HTTP on the home network, port 8787. The helper listens on every address of the computer, IPv4 and IPv6, so
    a device reaches it at the address the pair link carries, at its `.local` name's addresses and at whatever address
    it moved to, without a new bind. Four values come from the 32-byte pairing key with HKDF-SHA256 (salt empty), and
    the pairing key itself never travels:

    - the bearer, info `questpump bearer v1`, 32 bytes, sent base64url without padding as `Authorization: Bearer <b>`
      on every request but `GET /v1/hello`;
    - the seal key, info `questpump seal v1`, 32 bytes: every request and response body is sealed with AES-256-GCM as
      one `application/octet-stream` blob, a fresh random 12-byte nonce, then the ciphertext, then the 16-byte tag
      (CryptoKit's `SealedBox.combined`). A body is JSON before sealing, UTF-8, snake_case. Its associated data is its
      route (since the release security review of 2026-10-31, L1): the ASCII bytes of `questpump route v1 <way>
      <METHOD> <path>`, single spaces and nothing after, `<way>` `request` for a body a device sends and `answer` for
      one the helper sends back (a sealed refusal included), `<METHOD>` the request's method in capitals (`GET`,
      `POST`, `PUT`) and `<path>` its path without the query (`/v1/ping`'s answer is sealed for `/v1/ping` whatever
      its `t0`). So a body opens only as the route and the way it was sealed for: one recorded on a route and posted at
      another, or an answer sent back as a request, opens nowhere (`contract/fixtures/seal.json` `sealed`, `refused`);
    - the hello key, info `questpump hello v1`, 32 bytes, which keys a hello's proof of the key on the LAN
      (`GET /v1/hello`) and on Bluetooth (below), so a device tells the key it holds from a new pairing code before its
      bearer goes out, and a hello tells nobody without the key anything;
    - the key's id `kid`, info `questpump id v1`, 8 bytes, base64url without padding: the name a phone keeps for its
      pairing on the device. Nothing sends it since 2026-11-01 (the hello and the Bonjour record showed it).

    Every sealed request says when it was sent on the helper's clock (`sent_at`, the device's clock plus its offset),
    so a device pings before its first sealed request. The helper closes at once a connection from outside the home
    network's private ranges, refuses a request whose `Host` does not name the computer at the port the connection
    reached (421, no body, before the bearer is checked, on every route, the hello's included; since 2026-11-01, so a
    web page whose name an attacker points at the computer's address reaches nothing): an IPv4 literal, a bracketed
    IPv6 one (a zone allowed), `localhost` or the computer's own `.local` name (the `helper` block's `mdns`, in any
    case, a trailing dot allowed), each with that port. The phones send the address they hold or the `.local` name
    they found the computer by, and the Bonjour browse resolves to an address; over Bluetooth no `Host` travels and
    none is checked. It refuses a wrong bearer (401, no body; ten within a minute from one peer make it
    answer 429 for a minute), a body larger than 256 KiB (413) or slower than 10 s to arrive (408), a body that fails
    to open, whose `sent_at` lies more than 60 s from the helper's clock or before the helper started, or that repeats
    the nonce of a request of the last two minutes (400), a body that opens but does not read (422), and any request
    while its loop cannot take it (503; the device keeps what it sent). At most 32 connections are open, 8 from one
    address. A client drops a response that fails to open, or whose `t0` is not its request's. After a 400 a device
    pings before its next sealed request (its clock may have stepped); after a 422 it drops what that request carried,
    which will never read, rather than send it again, but for app rows sent beside events or samples, which stay
    unconfirmed and go again (slice 26: the helper drops a bad row row by row, so rows alone never make a body
    unreadable, and rows that were all a refused request carried count as sent). `POST /v1/sync`'s 422 drops only when
    it is the helper's: since the release security review of 2026-10-31 its body is `RefusedResponse`, sealed, naming
    the refused request's nonce (`contract/fixtures/seal.json` `refusals`), and a 422 that does not open under the
    pairing's seal key or names another nonce is no answer, so the device keeps everything and sends it again. Every
    other route's 422 is bare (`Unreadable`), and a sync body posted at another route does not open there. A sealed
    request whose JSON holds a field the helper does not know is refused 422 (since 2026-11-01), all but the sync's:
    a newer app adds fields and event types to `POST /v1/sync`, which an older desktop app ignores, since a 422 there
    would make the phone drop what it sent for good; the pair, unpair, body and account requests carry nothing a newer
    app adds alone (a body request's `body` is the shared `Body`, whose fields only add, and takes one it does not
    know).

    Every instant is integer milliseconds on the helper's wall clock, except a request's `t0` (the device's own
    clock, echoed back), `locked_until` (unix seconds), `/v1/history`'s `proofs_since` (unix seconds), the history rows
    and the sheets, which keep `rows.jsonl`'s and `sheets.jsonl`'s own units, `game_offer_at` (unix seconds) and a body
    field's `changed_at` (unix milliseconds on the clock of the device that made the change). A device converts through
    its clock offset (docs/companion.md, "Countdown sync"; `ClockOffset` in each phone core): the offset of the
    smallest round trip among its pings of the last 60 s, a fresh window after a clock step, with offset = helper minus
    device, so a helper instant is local as `t - offset` and a device instant reaches the helper as `t + offset`; the
    helper keeps no offset of its own.

    Every response carries `helper`, the helper's current name and address, so a device follows a DHCP change, and
    the computer's `.local` name (`mdns`) and the install's id (`hid`) when the helper has them, which a device keeps in
    its pair link, so it follows a renamed computer too. Since 2026-10-09 it also says what the computer knows of World
    of Warcraft (`wow`) and what the helper reads of it (`sight`), so the phones and the watches tell the same story as
    the computer: the pairing window's next step, the chip's and the watch's "QuestPump can't see the game", and the
    phones' card that adds QuestPump to the game.

    When the saved address stops answering, a phone looks for its helper (`contract/fixtures/find.json`, the decision
    every app replays): the `.local` name, a Bonjour browse for `_questpump._tcp` and, in the foreground, `GET
    /v1/hello` to every address of its own Wi-Fi /24. Only a Windows helper registers the Bonjour service (through
    Windows' DNS Client): instance `QuestPump` (Windows renames it on a clash, `QuestPump (2)`), host the computer's
    `.local` name with its IPv4 address, port 8787, TXT `txtvers=2` alone (since 2026-11-01; until then the instance was
    the computer's name and `txtvers=1` also carried `hid` and `kid`, which let any device on the network follow the
    computer). No phone reads the instance: each resolves every record to its address and asks its hello. A Mac helper
    never advertises, since that needs the Local Network privilege, whose answer can never be reset, and its `.local`
    name finds it anyway. Each candidate gets a hello under a challenge of the phone's, and the bearer only after that
    hello proved the pairing's install (`h`; a pairing made before the install id skips it) and the key the phone holds
    (`k`); the pairing's install with another key is the phone's helper with a new pairing code. Its sealed pong
    confirms it, and the pong's `helper.host` moves the pairing. The watch never looks: it asks its phone.

    **The Bluetooth link** (slice 43, docs/plan.md "Slice 43: the Bluetooth link", with its fixes after the review of
    2026-10-17; `contract/fixtures/ble.json` holds every value named here and the cases the helper and both phone cores
    replay): a second transport for the same routes, so a phone follows the game with its screen locked and links where
    the LAN cannot reach it (a guest Wi-Fi, client isolation, mobile data, Local Network refused, a Windows firewall
    without its rule). The computer is a GATT peripheral and the phones are centrals; the watches keep HTTP, and a phone
    relays nothing for them. One primary service (`uuids.service`) holds three characteristics: `hello` (read, plain,
    made for the central that reads it), `rx` (phone to helper: write without response, or write) and `tx` (helper to
    phone: notify only, each message to the central that asked for it alone). No characteristic asks for encryption and
    nothing bonds: a fourth value from the pairing key does that work, the ble key (HKDF-SHA256, salt empty, info
    `questpump ble v1`, 32 bytes).

    The hello (`ble.json` `gatt`) is the compact JSON `{"v":3,"k":…,"c":…}`: `v` the Bluetooth layout's version (3
    since 2026-11-01; 2 keyed its hashes with the install's id, which the pair link and every answer carry, so anyone
    who once saw it could follow the computer); `k` the first 8 bytes of HMAC-SHA256 keyed with the hello key over
    `questpump ble hello key`, the epoch (the UTC hour, floor(unix seconds / 3600)) as 8 bytes big-endian and `c`,
    base64url without padding, so nothing on the air names the computer and no stranger links one hello to another;
    and `c` the connection's challenge, 16 random bytes the helper draws
    whenever a central reads the hello from its start and keeps for that central's connection (a read at a later offset,
    part of a long read, gets the bytes kept; a read from the start again ends that central's calls as an unsubscribe
    does). A phone reads the hello once at each connection, after it discovered the service anew and before it
    subscribes or sends anything, and checks it at the epoch before, the current one and the one after on its own clock:
    `k` of one epoch the pairing key's, it links; else another computer, the pairing's own with a new pairing code
    (which nothing on the air tells apart) or a hello it does not read. A read that fails judges nothing (the phone
    lets the connection go and tries again). The link is up once a sealed ping on that connection answered, so a copied
    hello that never answers links nothing.

    Each call is the HTTP request the phone would send, sealed again whole: one envelope, AES-256-GCM under the ble key
    as a body is sealed (nonce, ciphertext, tag), its associated data 36 bytes: the direction's label (`questpump ble v1
    rx` toward the helper, `questpump ble v1 tx` toward the phone), the message's id (one byte, which the phone picks,
    0-255, never two of its calls in flight under one id, and the helper's answer repeats) and the connection's
    challenge. The helper opens a central's writes only under the challenge it keeps for that central and seals each
    answer under its request's id and challenge, so an envelope opens only on the connection it was sealed for: one
    captured and written again from another central, or on a later connection, opens nowhere. A request's plain text is
    its method (1 GET, 2 POST), its path with the query (`/v1/…`, 1-1024 bytes of visible ASCII), its User-Agent (0-255
    bytes) and its body as the LAN carries it (a POST's sealed under the seal key for its route, a GET's empty); a
    response's is the HTTP status and the body as the LAN answers it (sealed for its route's answer); an envelope
    carries no route of its own, since the body inside is the LAN's and opens only for the route its head names. No
    bearer travels: the helper adds its own and calls the routes the LAN serves, so the held sync, its holder rule, the
    re-offer, the receipts, `sent_at`'s freshness and the replay window are the LAN's, and the routes answer as they do
    on the LAN (never `401`). An envelope travels in chunks of at most min(ATT MTU − 3, 512) bytes, each a 4-byte header
    (the id, then the chunk's index from 0 in 3 bytes, big-endian) and its part, the first part starting with the
    envelope's length (4 bytes, big-endian).

    Limits (`ble.json` `limits`): an envelope of at most 288 KiB toward the helper and 2 MiB toward the phone, refused
    at its first chunk; a message's next chunk within 10 s of the one before; 4 messages put together at once by a
    receiver (a whole message in its first chunk takes no place among them); 4 calls a central at the helper, each from
    its envelope's opening until its answer's last chunk went to the radio (an answer queued and not yet sent counts), a
    request that opens beyond them answered `503` with no body under its id, which counts toward no throttle and which a
    phone takes as the LAN's 503 (it keeps what it sent and tries again); a phone keeps at most 4 calls of its own in
    flight, a fifth waiting for a free one within its own deadline rather than failing at once. The helper takes a
    central's writes only while its `tx` subscription stands (another central's chunks call no route) and keeps the
    LAN's throttle by central: 10 failures within a minute, each an envelope that does not open or a message its
    reassembly dropped while no envelope of that central had opened on its connection, have its writes ignored until a
    minute after the last, with one log line a minute for each central, its subscriptions and unsubscriptions included;
    once an envelope of it opened, its dropped messages count for nothing (the radio loses chunks). The helper answers
    nothing that does not open (a stranger's writes change nothing), `400` with no body to an envelope that opens but
    whose head does not read, `500` with no body when an answer's envelope would pass 2 MiB, and `503` as above. A phone
    drops an answer that does not open or read, or whose id names none of its calls in flight; it reads a call for as
    long as on the LAN.

    The computer advertises only while its Bluetooth link is on (the switch on its Phones page) and a phone is paired or
    the pairing code shows (the Phones page, or the pairing window the desktop app opens over a page; either asks
    macOS's Bluetooth grant in context): a Mac the service UUID and the local name `QuestPump` (`CBPeripheralManager`,
    which advertises nothing else), a Windows PC the service UUID and the service data `QP` 3 on it
    (`GattServiceProvider`, where its adapter has the peripheral role); neither carries an id of the computer. On a
    Windows PC without its firewall rule the code shows beside the firewall card while the Bluetooth link serves, so a
    phone pairs by Bluetooth. A new pairing code lets every central go (their calls end, their challenges and throttles
    with them) and publishes the service again, so a connected phone hears its services changed (iOS's
    `didModifyServices`, Android's `onServiceChanged`), reads the hello again and finds the new code; a phone whose call
    over Bluetooth heard no chunk by its deadline also reads the hello again before its next call. The `helper` block's
    `ble` says on every response how the link stands there. An iPhone links through AccessorySetupKit (two display
    items, the Mac's by the service UUID and the name, the PC's by the service UUID and the service data, so no
    Bluetooth prompt; the Settings app's Accessories row removes the link), an Android phone inside its foreground
    service from Android 12 with Nearby devices, never location, and a companion-device association where it can.

    Which way each call goes (one rule in each phone core, `ble.json`'s `route`): the held sync, the plain posts, the
    ping, the sheet, the body and the unpair go over Bluetooth while it links (connected, `tx` subscribed, the hello
    judged the pairing's and a sealed ping on that connection answered), else over the LAN; the pages (`/v1/history`,
    `/v1/sheets`, `/v1/app_rows`) go over the LAN when it answered in the last minute, else over Bluetooth with `limit`
    (`limits.pages`: 500, 50 and 500), never from a locked iPhone; a pairing goes over the LAN first and over Bluetooth
    once that failed. A call that fails over Bluetooth fails as itself: it never starts a look for the helper on the
    LAN. A phone's held request on Bluetooth may wait up to 10 minutes (`wait` up to 600,000, `ble_wait_max_ms`): the
    helper counts that client alive, and the link's holder, past the LAN's 25 s only while a held request of it is
    pending at the helper (from its arrival until its answer went to the radio), and for 25 s after its last one was
    answered; a disconnect or an unsubscribe ends that at once, so the link passes to the next device, and a watch that
    syncs still holds the link first. A phone that steps back for its watch's play session while linked keeps one
    standing request over Bluetooth instead (since the review of 2026-10-17: `hold: false` with `wait`, `/v1/sync`),
    its `tx` on: it holds nothing, and the helper answers it the moment no device holds the link (`unheld`), so a
    locked phone whose watch app died hears it within the 25 s the watch's link lapses in and takes the link. Bluetooth
    has no other way to call a request off, so a phone that stops both while linked (the player stopped following, or
    nothing holds the phone to the computer any more) turns `tx`'s notifications off, which ends its calls at the
    helper, and on again before its next call; until either runs again they go off whenever no call of it is under
    way, after each call and on each new connection. A request of either kind ends the other at the helper as it
    arrives. A client that stays linked for hours has its `link` line written to `helper.log` at least once an hour,
    not only when it goes quiet. The LAN link stays as it is, and nothing of the game, the strip, the mirror or an
    exercise rule changes.

    The felt-unwell lock reaches every device (docs/plan.md slice 17; `contract/fixtures/lock.json`): the helper's
    `locked_until` in every sync and sheet response, a device's own stop (a catch-up's `pump_done` with `unwell`,
    which the helper turns into rows, or an app pump's stop row among its app rows, a phone's since slice 26 and a
    watch's since slice 31; both reach `locked_until`), and the phone and the watch telling each other the lock they
    hold,
    without the helper: on Apple the key `locked_until` (unix seconds) in each side's WatchConnectivity application
    context, beside what each already carries there, and on Android the data item `/questpump/lock` with
    `locked_until`, which each side writes under its own node. Each device obeys the latest end it has heard while it
    lies ahead, and never lifts a lock because a response or the other device leaves it out.
    Since slice 32's third review the Apple Watch also sends a lock later than the last the phone told it by
    `sendMessage` under the same key (`locked_until`, no Pro gate), beside its context, which wakes the iPhone's app
    (`session(_:didReceiveMessage:)`), so the phone plans its reminders again at once rather than at its next wake; with
    the phone out of reach the message is owed (kept across a relaunch) and goes once the phone is reachable, while the
    lock still lies ahead.

    The offer after a match on the computer (slice 35, docs/plan.md "The offer after a match"): when a game QuestPump on
    the computer watches ends a match (since slice 56 every game it finds, the Riot games too since 2026-10-28,
    each match or at its close; a game the player turned on until then), or a program the player added closes, the
    helper decides one offer under its own gate and shows its card on the computer. Since slice 48's double-check the computer asks first:
    it queues `match_end` (`Command`) for the device that holds the link, which raises it as its own notice, only when
    the computer cannot ask, at a look after the card's chance while the offer stands, its card's time holds and
    nothing answered it on the computer (a held offer once its hold ended), nothing holds offers back there, no watched
    game is in a match, and the card could not show (the game in front on its one screen) or has shown to no input for
    `match_away_s`; an offer answered on the computer first never reaches a device. Whichever device starts the pump an
    offer opened names the offer in `offer_taken`, kept and sent again in every request until a response arrives, as an
    event is; the helper takes the queued command back, closes the computer's card and lists the id in
    `offer_withdrawn` in every response to every device (held, superseded and plain) while the offer had not expired,
    as it does for an offer that went out and was then put off with the computer card's Later or ×, or answered by a
    move done since on any device, so a device that raised it takes its notice back, and a device that never hears the
    withdrawal loses its notice at the command's `expires_at`. `game_offer_at` keeps `link_gap_min` between
    the phones' game links' offers across the devices: each request names the device's latest posted game offer, every
    response the latest the helper knows on any device (its own match offers and every device's), and each device gates
    its next link offer on the later of its own and the one it heard. Since slice 48 (`docs/computer-games.md`) the
    computer's match offers keep no gap, no quiet hours and no daily cap, and since slice 57 every match asks, a
    match's floor spacing them (its run's `match_min_s`, League's `match_min_league_s`, a feed's match from its
    start); the computer's sitting clock (`match_sat_min`; it spaced them from slice 48 to slice 57) decides only
    whether the pump opens on its warm move, restarted by a performed move on any device and by a 5-minute pause in the
    computer's input (a watched game counting as input only while its window is in front or a match runs), and at 04:00
    only on a computer whose input idle time never reads (since slice 48's double-check); the latest game offer on any
    device (this same `game_offer_at`) restarts it for the computer's sitting cue alone since slice 57, never for the
    warm move, so an offer let pass keeps the next one's warm move; a phone's notice of a computer match
    keeps the phone's quiet hours and takes no place under the phone's cap. `playing`, in every response, says while it is true that a
    watched game on the computer is in a match (the Android phone's off-screen hold counted it as word from the helper
    until 2026-10-13, when that hold began to last while the phone is paired; no device acts on it since), and
    `arms`, since slice 48's double-check, that an aim game resting the arms runs on the computer now.

    One body on every app device (slice 35): the free mode's engine profile's Body switches (`no_jump`, `no_strain`,
    `no_head_down`), its `experience`, its moves (`exclude` and `include`), since 2026-10-09 its `favourites` and its
    `title`, and since slice 48 its `match_pace` (Moves per match, which the game has none of) travel between the helper and every paired phone through the sealed `POST /v1/body` (`Body`), each
    field with its own `changed_at`; the later change wins field by field, and a tie goes to the helper's. A field a
    device never changed (a default, a profile restored from a file without times) never travels. Since 2026-10-30 the
    same fields with their times travel between a player's phones in their book too (the backup file's `body`, and
    since slice 60 the sync's `device` batch's `stamps`: `contract/fixtures/backup.json`), merged the same way, a tie to
    the book's, and a field taken from one keeps its time. The game's Body switches and, since 2026-10-09,
    its Exercises page's list (`moves`), which the helper reads off the profile the strip paints and the files it takes
    in, join at the time the game changed each (the profile's `bodyAt`), or, for a field from before those times, as a
    change at the helper's time whenever the game's value differs from the last one the helper saw within the same
    profile (by its install and its name, so another character's profile or another install's is never a change; the
    first it sees of a profile counts against the addon's defaults, every switch off, nothing left out); one body
    everywhere, the game included (2026-10-09): the mirror carries the switches and the moves back (`QuestPumpMirror`'s
    `body`), and the game takes each one that changed later than its own change of it at its next load. The pain
    flags and the focus stay rows. Since slice 51 (Away Mode; `contract/places.json`) a device keeps a list of places,
    Home first, and one in use: Home's equipment and three switches (Floor moves, Room to move, Quiet mode) travel as
    the field `home` between the game, the computer and the phones (the game's one setup is Home: its own changes join
    at the profile's `bodyAt.home`, as the Body switches join at `bodyAt`, and the mirror's `body` carries `home` back, which
    the game takes at its next load with its chat line), and the other places as the field `places`, the whole list
    without Home, between the phones and the computer only (the game shows no other place); two fields, so a change to
    Home in the game and a rename of a hotel on a phone never overwrite each other. The place in use stays each
    device's own and never travels: a device whose place in use left the list takes Home. A device that does not know
    `home` or `places` ignores them, and a helper that does not keeps neither, which is harmless: each device keeps
    its own list until both sides know them. Until 2026-10-21 the place (the equipment, the space, quiet, the floor)
    stayed each device's own.
    A watch never calls the route:
    its phone relays its whole profile to it. An instant on a device's own clock that lies more than a day past the
    helper's clock (a clock set ahead) never counts: the helper drops a body field whose `changed_at` does, and leaves
    out a request's `game_offer_at` that does, so neither wins every later change or gates every game offer until then.

    The phone and its watch share the app's rows (docs/plan.md slice 31), so the watch composes its own app pumps from
    the player's records with the phone in reach or not, and never from synced state: records come from rows.
    Phone to watch, the latest value: the free mode's engine profile (`EngineProfile` JSON: the gear, the floor, the
    space, quiet, the Body switches, the exclusions, include, the favourites, the experience, the title, since slice 48
    the match pace; since slice 51 the place in use's gear and switches, and since slice 67, while work mode runs, work
    mode's own equipment, `Work`'s, in their place), the app's
    pain rows (the newest 64; a flag's latest set or clear wins in the fold), the figure's colour of the sheet it shows
    (0xRRGGBB, absent when none names one) and that sheet's focus (absent when it names none; never the demo's), which
    the watch's fold takes as the phone's does (`sheetFocus`); on Apple the application context keys `profile`, `pain`,
    `tint` and `sheet_focus` beside `coach`, `pair_link` and `locked_until`, on Android the data item
    `/questpump/phone` with the same names beside `coach`. Since slice 51 both also carry `place`, the place in use's
    name as the phone shows it (the player's own, or its template's words in the phone's language; at most 24 Unicode
    scalars), which the watch's pick page shows as its place line and never edits; without it (an older phone) the
    watch shows no place line.
    Since slice 32 the same context and item carry `pro` (a boolean: Pro holds on the phone or its demo), which the
    watch keeps as it last heard it for its complications, tiles and widget (the glance is free): the iPhone leaves it
    out until its first StoreKit read at launch has ended, Android puts the last answer Play gave until Play answers
    the launch, and a context or item without it (a phone build before it sends none) leaves the kept value standing.
    Watch to phone on Apple, the Live Activity's state of the pump on the wrist (`LiveState`: its moves' names in
    order, how many are done, the one on screen with its goal, when a running hold or timed move started and when a
    timed move or a countdown ends, the next move's name, whether the pump ended; under 4 KB) under the key `live`, by
    `sendMessage` while the phone is reachable (for every player since 2026-10-13: the Live Activity is free, Pro
    keeps its next move's line), and the latest in the watch's application context under the same key beside the play
    flag (`session`, `session_at` and since 2026-10-13 `linked`, true while the watch's link answers, the phone holding
    the helper's link itself while it is false, as Android's `linked`; absent from an older watch, read as true),
    which it waits for as the lock does. The context
    carries only a pump told since the play flag's `running` last changed: the watch drops `live` from it at a
    session's start and end, and the phone takes each context whole, so a context without `live` means no pump told
    since and a new session never opens on the last session's state. At a session's end the watch also sends its play flag by `sendMessage`
    (the phone reachable), which wakes the phone's app, so its Live Activity ends without the phone in front.
    On Android the watch's play flag is the data item `/questpump/session` (`DataLayer.WATCH_SESSION`: `running`,
    `linked`, `at`), which the phone reads as a `WatchSession`; since slice 32's third review it carries `pumping` (a
    boolean, written again whenever it changes: true while a move runs or an app or game pump is on the wrist; absent,
    from an older watch, reads as false), which the phone's reminders count as a pump running (a streak reminder takes
