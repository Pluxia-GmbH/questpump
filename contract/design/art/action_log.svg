<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The Saga button (the Log's tab, named Saga for players since 2026-10-15; its scroll until then): a swallowtail
       banner hanging from a rounded rod, the record's up chevron cut through the cloth by the even-odd rule, so the
       ground shows through it. The rod and the cloth are plates in the tint; lit from the top left, the rod's
       underside and the cloth's right half in shadow, the shadow tracing round the chevron's right arm so the cut-out
       stays clear. -->
