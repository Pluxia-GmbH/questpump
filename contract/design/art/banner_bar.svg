  <!-- The level-up banner's bar, drawn as is above the words and again under them, never mirrored: a long gold bar of
       two facets tapering to a point at each end, through a collar either side to a raised six-sided centre boss, its
       bevel cut in six facets round a sunken field in bevel with a gold domed rivet in the middle and a small rivet
       either side. Lit from the top left: the upper facets in light, the lower in shadow, the boss's left facets
       lighter than its right and the field's upper rim in shadow, so its light reads the same above and below the
       words. -->
