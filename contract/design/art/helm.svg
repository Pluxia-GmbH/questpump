<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The armour figure's great helm from the front, for the coach's portrait: a domed plate bucket with a ridge over
       its crown, a riveted brow band with thin gold trim along both its edges, the eye slit either side of the riveted
       centre strip that runs down the face to the rim plate, and three breaths either side of the strip. Lit from the
       top left: the crown's left catches the light, the face rounds into shadow on the right, with a rim light along
       that edge. It stays inside a circle of radius 21.5 around its centre, so the caller draws it at 48 under the
       portrait ring (portrait_ring.svg, 56 units, offset 4 and 4). -->
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="12" y1="5" x2="36" y2="42">
      <stop offset="0" data-token="outline" stop-color="#8F7F63"/>
      <stop offset="0.45" data-token="bevel" stop-color="#6B5E4A"/>
      <stop offset="1" data-token="iron" stop-color="#4A4238"/>
    </linearGradient>
    <linearGradient id="round" gradientUnits="userSpaceOnUse" x1="8.9" y1="0" x2="39.1" y2="0">
      <stop offset="0" data-token="void" stop-color="#050404" stop-opacity="0.22"/>
      <stop offset="0.12" data-token="text" stop-color="#F2EBDC" stop-opacity="0.08"/>
      <stop offset="0.25" data-token="text" stop-color="#F2EBDC" stop-opacity="0.24"/>
