<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Pause (a move's figure playing: a tap stops it): two upright bar plates with chamfered ends, as far apart as each
       is wide, on the 24-unit grid; lit from the top left, a ridge runs down each bar, so its right half is in shadow.
       One colour, never mirrored (a player's control, not a direction): the caller tints it (text2 in a round button
       on card). -->
  <path data-token="tint" fill="currentColor" d="
    M6.25 3.5 H9.25 L10 4.25 V19.75 L9.25 20.5 H6.25 L5.5 19.75 V4.25 Z
    M14.75 3.5 H17.75 L18.5 4.25 V19.75 L17.75 20.5 H14.75 L14 19.75 V4.25 Z"/>
  <path data-token="void" fill-opacity="0.35" d="
    M7.75 3.5 H9.25 L10 4.25 V19.75 L9.25 20.5 H7.75 Z
    M16.25 3.5 H17.75 L18.5 4.25 V19.75 L17.75 20.5 H16.25 Z"/>
</svg>
