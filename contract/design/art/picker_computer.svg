<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120">
  <!-- The accessory picker's image (slice 43): iOS's AccessorySetupKit shows it beside "QuestPump on <computer>" when
       the iPhone links to the computer by Bluetooth, in a box of 180 x 120 points on a light or a dark sheet (WWDC24
       10203: a transparent background, the transparent border sizing the accessory in the box). A laptop in the app
       icon's blue steel, lit from the top, its screen dark with a gold glow, and on it the app icon's mark, the quest
       scroll barbell (contract/design/icon/mark.svg, its shapes moved onto the screen at 1.5 times their size,
       centred at 90, 49.5). The void outlines and the shadow carry it on a light sheet, the frost edges on a dark one.
       Drawn 2026-10-16. -->
  <defs>
    <linearGradient id="lid" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="82">
      <stop offset="0" data-token="steel" stop-color="#5F7396"/>
      <stop offset="1" data-token="steelLo" stop-color="#313C5A"/>
    </linearGradient>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="46" y1="22" x2="134" y2="77">
      <stop offset="0" data-token="raised" stop-color="#241F19"/>
      <stop offset="1" data-token="page" stop-color="#0F0D0A"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="90" cy="49.5" r="40">
      <stop offset="0" data-token="gold" stop-color="#E8B84A" stop-opacity="0.28"/>
      <stop offset="1" data-token="gold" stop-color="#E8B84A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck" gradientUnits="userSpaceOnUse" x1="0" y1="82" x2="0" y2="96">
      <stop offset="0" data-token="steel" stop-color="#5F7396"/>
      <stop offset="0.55" data-token="steelLo" stop-color="#313C5A"/>
      <stop offset="1" data-token="steelLo" stop-color="#313C5A"/>
    </linearGradient>
    <linearGradient id="m_plate" gradientUnits="userSpaceOnUse" x1="54" y1="27.75" x2="54" y2="71.25">
      <stop offset="0" data-token="steel" stop-color="#5F7396"/>
      <stop offset="0.14" data-token="frost" stop-color="#9CC8E6"/>
      <stop offset="0.42" data-token="steel" stop-color="#5F7396"/>
      <stop offset="0.62" data-token="steelLo" stop-color="#313C5A"/>
      <stop offset="1" data-token="steelLo" stop-color="#313C5A"/>
    </linearGradient>
    <linearGradient id="m_rod" gradientUnits="userSpaceOnUse" x1="54" y1="45.75" x2="54" y2="53.25">
      <stop offset="0" data-token="goldLo" stop-color="#C8952F"/>
      <stop offset="0.25" data-token="goldHi" stop-color="#F5CF6E"/>
      <stop offset="0.55" data-token="gold" stop-color="#E8B84A"/>
      <stop offset="1" data-token="goldLo" stop-color="#C8952F"/>
    </linearGradient>
    <linearGradient id="m_sheet" gradientUnits="userSpaceOnUse" x1="78" y1="36" x2="102" y2="63">
      <stop offset="0" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="1" data-token="parchmentLo" stop-color="#E0D1B0"/>
    </linearGradient>
    <linearGradient id="m_rollL" gradientUnits="userSpaceOnUse" x1="75" y1="13.5" x2="79.5" y2="13.5">
      <stop offset="0" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="0.45" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="1" data-token="ink2" stop-color="#6B5638"/>
    </linearGradient>
    <linearGradient id="m_rollR" gradientUnits="userSpaceOnUse" x1="100.5" y1="13.5" x2="105" y2="13.5">
      <stop offset="0" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="0.45" data-token="parchmentLo" stop-color="#E0D1B0"/>
      <stop offset="1" data-token="ink2" stop-color="#6B5638"/>
    </linearGradient>
  </defs>
  <!-- the shadow on the surface -->
  <ellipse data-token="void" fill="#050404" fill-opacity="0.18" cx="90" cy="99" rx="72" ry="3.5"/>
  <!-- the base: its top in perspective, then its front edge with the opening notch -->
  <path fill="url(#deck)" data-stroke-token="void" stroke="#050404" stroke-width="0.8" stroke-linejoin="round" d="
    M34 82 H146 L159 91 V93 C159 94.66 157.66 96 156 96 H24 C22.34 96 21 94.66 21 93 V91 Z"/>
  <path data-stroke-token="frost" stroke="#9CC8E6" stroke-opacity="0.55" fill="none" stroke-width="0.8" stroke-linecap="round" d="
    M35 82.8 H145"/>
  <path data-token="void" fill="#050404" fill-opacity="0.35" d="M80 91 H100 V92 C100 92.55 99.55 93 99 93 H81 C80.45 93 80 92.55 80 92 Z"/>
  <!-- the lid: its frame, then the screen, its glow, and the mark on it -->
  <path fill="url(#lid)" data-stroke-token="void" stroke="#050404" stroke-width="0.8" d="
    M45 16 H135 C137.76 16 140 18.24 140 21 V82 H40 V21 C40 18.24 42.24 16 45 16 Z"/>
  <path data-stroke-token="frost" stroke="#9CC8E6" stroke-opacity="0.6" fill="none" stroke-width="0.8" stroke-linecap="round" d="
    M45.5 16.8 H134.5"/>
  <rect fill="url(#glass)" data-stroke-token="void" stroke="#050404" stroke-width="0.6" x="46" y="22" width="88" height="55" rx="1.5"/>
  <rect fill="url(#glow)" x="46" y="22" width="88" height="55" rx="1.5"/>
  <rect fill="url(#m_rod)" data-stroke-token="void" stroke="#050404" stroke-width="0.6" x="58.5" y="45.75" width="63" height="7.5" rx="2.4"/>
  <path fill="url(#m_sheet)" data-stroke-token="void" stroke="#050404" stroke-width="0.6" d="M 78 36.9 C 84.75 38.55 95.25 38.55 102 36.9 L 102 62.1 C 95.25 60.45 84.75 60.45 78 62.1 Z"/>
  <rect fill="url(#m_rollL)" data-stroke-token="void" stroke="#050404" stroke-width="0.6" x="75" y="33.9" width="4.5" height="31.2" rx="2.25"/>
  <rect fill="url(#m_rollR)" data-stroke-token="void" stroke="#050404" stroke-width="0.6" x="100.5" y="33.9" width="4.5" height="31.2" rx="2.25"/>
  <ellipse data-token="parchmentLo" fill="#E0D1B0" data-stroke-token="ink2" stroke="#6B5638" stroke-width="0.38" cx="77.25" cy="35.25" rx="1.72" ry="0.68"/>
  <ellipse data-token="parchmentLo" fill="#E0D1B0" data-stroke-token="ink2" stroke="#6B5638" stroke-width="0.38" cx="102.75" cy="35.25" rx="1.72" ry="0.68"/>
  <rect fill="url(#m_plate)" data-stroke-token="void" stroke="#050404" stroke-width="0.6" x="66" y="27.75" width="9" height="43.5" rx="2.7"/>
  <rect fill="url(#m_plate)" data-stroke-token="void" stroke="#050404" stroke-width="0.6" x="105" y="27.75" width="9" height="43.5" rx="2.7"/>
  <path data-token="void" fill="#050404" fill-opacity="0.2" d="M 98.25 48.45 Q 99.03 50.4 98.33 52.39 Q 97.62 54.38 96.31 56.05 Q 94.98 57.7 92.88 58.12 Q 90.75 58.52 88.8 57.84 Q 86.86 57.13 85.23 55.83 Q 83.58 54.54 83.19 52.47 Q 82.8 50.4 83.11 48.3 Q 83.44 46.17 85.08 44.79 Q 86.7 43.38 88.74 42.91 Q 90.75 42.45 92.82 42.84 Q 94.89 43.23 96.18 44.88 Q 97.48 46.52 98.25 48.45 Z"/>
  <path data-token="figureCrimson" fill="#C45050" data-stroke-token="void" stroke="#050404" stroke-width="0.6" d="M 97.5 47.55 Q 98.28 49.5 97.58 51.49 Q 96.87 53.47 95.56 55.16 Q 94.23 56.8 92.13 57.22 Q 90 57.62 88.05 56.94 Q 86.11 56.23 84.48 54.93 Q 82.83 53.64 82.44 51.57 Q 82.05 49.5 82.36 47.4 Q 82.69 45.27 84.33 43.89 Q 85.95 42.48 87.99 42.02 Q 90 41.55 92.07 41.94 Q 94.14 42.33 95.43 43.98 Q 96.73 45.62 97.5 47.55 Z"/>
  <circle data-token="void" fill="#050404" fill-opacity="0.2" cx="90" cy="49.5" r="5.4"/>
  <path data-stroke-token="text" stroke="#F2EBDC" stroke-opacity="0.35" fill="none" stroke-width="0.75" stroke-linecap="round" d="M 83.4 50.7 C 82.8 47.1 85.2 43.65 88.8 42.9"/>
  <polyline data-stroke-token="goldHi" stroke="#F5CF6E" fill="none" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" points="86.1,51.75 90,47.85 93.9,51.75"/>
</svg>
