  <!-- Title: a scroll banner, a front band arched up in the middle over two tails that run behind its ends and down to
       swallowtail cuts; the right tail is the left one mirrored inside the drawing. Lit from the top left: the tails in
       shadow, the folds under the band's ends darker still. Tint layers painted back to front (the tails and their
       shading first, the band last), so the caller colours it by state; drawn as is, never mirrored. -->
