<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The wax seal (the Saga's Quest Bill, 2026-10-15: a record's line and the card's seal of a best day or a quality
       word): a round blob of crimson wax (artTone wax) with a gently waving edge, pressed in its middle by a round die
       whose rim rings a hollow, a ring of small dots stamped round it, and the app mark's gold up chevron (beat your
       record) standing in the hollow. Lit from the top left: the wax's light falls from there and its far edge is in
       shadow, the hollow's top left rim in shadow and its bottom right rim catching the light, the chevron's right arm
       in shadow over its own shadow on the wax. Drawn as is, never mirrored or tinted. -->
  <defs>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="17" cy="15" r="24">
      <stop offset="0" data-token="text" stop-color="#F2EBDC" stop-opacity="0.3"/>
      <stop offset="1" data-token="text" stop-color="#F2EBDC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" gradientUnits="userSpaceOnUse" cx="19" cy="18" r="30">
      <stop offset="0.45" data-token="void" stop-color="#050404" stop-opacity="0"/>
      <stop offset="1" data-token="void" stop-color="#050404" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="chevron" gradientUnits="userSpaceOnUse" x1="0" y1="15.6" x2="0" y2="27.6">
      <stop offset="0" data-token="goldHi" stop-color="#F5CF6E"/>
      <stop offset="0.45" data-token="gold" stop-color="#E8B84A"/>
      <stop offset="1" data-token="goldLo" stop-color="#C8952F"/>
    </linearGradient>
  </defs>
