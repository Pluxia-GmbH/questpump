<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The star: a five-point star cut into ten facets, a ridge from the centre to each point and each notch; lit from
       the top left, so the facets darken in steps as they turn from the light, with a step between the two facets of
       every point so each ridge shows. One plate in the tint: gold for an earned star (a TalentColumn pip, a star
       reward's pip, a title toast's frame glyph), lineStrong for a pip not yet earned, text3 on a missed one; a star
       reward's glyph takes its move's quality tone. Drawn as is, never
       mirrored. -->
