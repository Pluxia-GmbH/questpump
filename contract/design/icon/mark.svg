<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The app icon's mark, the quest scroll barbell (David, 2026-10-10: round 2's concept 1 of the logo exploration,
       "Scroll barbell, cut down"), which replaced the helm as the app icon (the helm stays the Portrait's art,
       contract/design/art/helm.svg). Four parts: a gold rod, one blue-steel plate a side, and between them an open
       quest scroll whose two rolled ends, their spiral tops showing, sit where a barbell has its collars; a crimson wax
       seal with a gold up chevron (beat your record) is pressed in its middle. Lit from the top left. Wide and short
       on the 48-unit grid (x 3-45, y 9.5-38.5), inside a circle of radius 21.5 around its centre (24, 24);
       tools/icons.py places it on every icon. Its own tones, steel and steelLo, are tokens.json artTone's. -->
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="9.5" x2="0" y2="38.5">
      <stop offset="0" data-token="steel" stop-color="#5F7396"/>
      <stop offset="0.14" data-token="frost" stop-color="#9CC8E6"/>
      <stop offset="0.42" data-token="steel" stop-color="#5F7396"/>
      <stop offset="0.62" data-token="steelLo" stop-color="#313C5A"/>
      <stop offset="1" data-token="steelLo" stop-color="#313C5A"/>
    </linearGradient>
    <linearGradient id="rod" gradientUnits="userSpaceOnUse" x1="0" y1="21.5" x2="0" y2="26.5">
      <stop offset="0" data-token="goldLo" stop-color="#C8952F"/>
      <stop offset="0.25" data-token="goldHi" stop-color="#F5CF6E"/>
      <stop offset="0.55" data-token="gold" stop-color="#E8B84A"/>
      <stop offset="1" data-token="goldLo" stop-color="#C8952F"/>
    </linearGradient>
    <linearGradient id="sheet" gradientUnits="userSpaceOnUse" x1="16" y1="15" x2="32" y2="33">
      <stop offset="0" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="1" data-token="parchmentLo" stop-color="#E0D1B0"/>
    </linearGradient>
    <linearGradient id="rollL" gradientUnits="userSpaceOnUse" x1="14" y1="0" x2="17" y2="0">
      <stop offset="0" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="0.45" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="1" data-token="ink2" stop-color="#6B5638"/>
    </linearGradient>
    <linearGradient id="rollR" gradientUnits="userSpaceOnUse" x1="31" y1="0" x2="34" y2="0">
      <stop offset="0" data-token="parchment" stop-color="#EBDFC4"/>
      <stop offset="0.45" data-token="parchmentLo" stop-color="#E0D1B0"/>
      <stop offset="1" data-token="ink2" stop-color="#6B5638"/>
    </linearGradient>
  </defs>
  <!-- the rod -->
  <rect fill="url(#rod)" data-stroke-token="void" stroke="#050404" stroke-width="0.4" x="3" y="21.5" width="42" height="5" rx="1.6"/>
  <!-- the sheet and its rolled ends, the rolls' spiral tops -->
  <path fill="url(#sheet)" data-stroke-token="void" stroke="#050404" stroke-width="0.4" d="
    M16 15.6 C20.5 16.7 27.5 16.7 32 15.6 V32.4 C27.5 31.3 20.5 31.3 16 32.4 Z"/>
  <rect fill="url(#rollL)" data-stroke-token="void" stroke="#050404" stroke-width="0.4" x="14" y="13.6" width="3" height="20.8" rx="1.5"/>
  <rect fill="url(#rollR)" data-stroke-token="void" stroke="#050404" stroke-width="0.4" x="31" y="13.6" width="3" height="20.8" rx="1.5"/>
  <ellipse data-token="parchmentLo" fill="#E0D1B0" data-stroke-token="ink2" stroke="#6B5638" stroke-width="0.25" cx="15.5" cy="14.5" rx="1.15" ry="0.45"/>
  <ellipse data-token="parchmentLo" fill="#E0D1B0" data-stroke-token="ink2" stroke="#6B5638" stroke-width="0.25" cx="32.5" cy="14.5" rx="1.15" ry="0.45"/>
  <!-- the plates -->
  <rect fill="url(#plate)" data-stroke-token="void" stroke="#050404" stroke-width="0.4" x="8" y="9.5" width="6" height="29" rx="1.8"/>
  <rect fill="url(#plate)" data-stroke-token="void" stroke="#050404" stroke-width="0.4" x="34" y="9.5" width="6" height="29" rx="1.8"/>
  <!-- the seal: its shadow on the sheet, the wax, the stamped hollow, the chevron -->
  <path data-token="void" fill="#050404" fill-opacity="0.2" d="
    M29.5 23.3 Q30.02 24.6 29.55 25.93 Q29.08 27.25 28.21 28.37 Q27.32 29.47 25.92 29.75 Q24.5 30.01 23.2 29.56
    Q21.91 29.09 20.82 28.22 Q19.72 27.36 19.46 25.98 Q19.2 24.6 19.41 23.2 Q19.63 21.78 20.72 20.86
    Q21.8 19.92 23.16 19.61 Q24.5 19.3 25.88 19.56 Q27.26 19.82 28.12 20.92 Q28.99 22.01 29.5 23.3 Z"/>
  <path data-token="figureCrimson" fill="#C45050" data-stroke-token="void" stroke="#050404" stroke-width="0.4" d="
    M29 22.7 Q29.52 24 29.05 25.33 Q28.58 26.65 27.71 27.77 Q26.82 28.87 25.42 29.15 Q24 29.41 22.7 28.96
    Q21.41 28.49 20.32 27.62 Q19.22 26.76 18.96 25.38 Q18.7 24 18.91 22.6 Q19.13 21.18 20.22 20.26
    Q21.3 19.32 22.66 19.01 Q24 18.7 25.38 18.96 Q26.76 19.22 27.62 20.32 Q28.49 21.41 29 22.7 Z"/>
  <circle data-token="void" fill="#050404" fill-opacity="0.2" cx="24" cy="24" r="3.6"/>
  <path data-stroke-token="text" stroke="#F2EBDC" stroke-opacity="0.35" fill="none" stroke-width="0.5" stroke-linecap="round" d="
    M19.6 24.8 C19.2 22.4 20.8 20.1 23.2 19.6"/>
  <polyline data-stroke-token="goldHi" stroke="#F5CF6E" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" points="21.4,25.5 24,22.9 26.6,25.5"/>
</svg>
