ShortDescription: Exercise pumps between games, synced with the add-on and the phone app
Description: |-
  QuestPump on your computer: the desktop app of QuestPump, a free add-on for World of Warcraft that asks for an
  exercise set when you turn in a quest. It reads the small status strip the add-on shows in the corner of the game
  window, keeps your progress in the game's AddOns folder, pairs your phone and watch over your home network, and runs
  pumps on its own screen, at a click or after a match in another game. It never sends input to a game and never reads
  a game's memory. Free and open source.
